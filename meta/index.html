<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta | Sanjana Garimella</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <h1>Meta</h1>

    <p>
      Stats about the code of this website, computed from its git history
      with <a href="https://www.npmjs.com/package/elocuent">elocuent</a>.
    </p>

    <!-- Step 1.3: summary stats -->
    <h2>Summary</h2>
    <div id="stats"></div>

    <!-- Step 2: scatterplot -->
    <h2>Commits by time of day</h2>
    <div id="chart"></div>

    <!-- Step 5.5 and 5.6: info about the brushed commits -->
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>

    <!-- Step 3: tooltip, hidden until a dot is hovered -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </body>
</html>
