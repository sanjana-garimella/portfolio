<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta | Sanjana Garimella</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <h1>Meta</h1>

    <p>
      Stats about the code of this website, computed from its git history
      with <a href="https://www.npmjs.com/package/elocuent">elocuent</a>.
    </p>

    <!-- Lab 8 Step 1.1: slider that picks the latest commit time to show -->
    <div id="time-filter">
      <label>
        Show commits until:
        <input type="range" id="commit-progress" min="0" max="100" value="100" />
        <time id="commit-time"></time>
      </label>
    </div>

    <!-- Step 1.3: summary stats -->
    <h2>Summary</h2>
    <div id="stats"></div>

    <!-- Lab 8 Step 3.1: commit text on the left, sticky scatterplot on the right -->
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>

        <!-- Step 5.5 and 5.6: info about the brushed commits -->
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <!-- Lab 8 Step 2: one dot per line of code, grouped by file -->
    <h2>Lines of code by file</h2>
    <dl id="files"></dl>

    <!-- Step 3: tooltip, hidden until a dot is hovered -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <!-- Renamed from commit-time, which the slider's <time> now uses -->
      <dt>Time</dt>
      <dd id="commit-tooltip-time"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </body>
</html>
